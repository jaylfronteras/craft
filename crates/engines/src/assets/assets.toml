# Picture models for the OpenAI-compatible image API (`POST {base}/images/generations`).
# `provider` is the asset provider id (`openai`). `endpoint` is the `model` field sent to the
# server. Prices are list prices used to stay inside a project's budget; the API does not return
# a bill. DALL-E 3 standard quality is $0.040 at 1024×1024 and $0.080 at 1792×1024 or 1024×1792
# (OpenAI's published prices). GPT Image is billed by tokens; $0.040 / $0.060 is a rough
# medium-quality estimate, not an invoice. A `[assets] image_model` value that isn't an id here
# is still sent as the model name, priced like the default. The server is `[assets] base_url`,
# else OPENAI_BASE_URL, else https://api.openai.com/v1. The key is OPENAI_API_KEY or the stored
# `assets:openai` key.
#
# 3D models are not listed. OpenAI-compatible APIs have no standard 3D endpoint.

[default]
image = "dall-e-3"

[[image]]
id = "dall-e-3"
provider = "openai"
name = "DALL-E 3"
endpoint = "dall-e-3"
usd_per_image = 0.04
usd_large = 0.08
licence = "Generated through the image API; the provider's terms apply"

[[image]]
id = "gpt-image-1"
provider = "openai"
name = "GPT Image 1"
endpoint = "gpt-image-1"
usd_per_image = 0.04
usd_large = 0.06
licence = "Generated through the image API. The price is an estimate, not an invoice."
